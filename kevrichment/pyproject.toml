[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "kevrichment"
version = "0.1.0"
description = "CISA KEV + Vulnrichment enrichment — agentic research for BOD 26-04 patching priority"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zach Argüelles", email = "zach@arguelles.me"},
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.8.0",  # floor above GHSA-8988-9cw3-xx77 (high), GHSA-vxq7-64xx-v4gw (high), GHSA-gh4c-6fx4-qh6g (moderate); requests pulls it transitively
]

[project.urls]
Repository = "https://github.com/zarguell/kevrichment"
Issues = "https://github.com/zarguell/kevrichment/issues"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
