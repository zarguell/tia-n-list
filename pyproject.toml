[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kevrichment"
version = "0.1.0"
description = "CISA KEV + Vulnrichment enrichment — agentic research for BOD 26-04 patching priority"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zach Argüelles", email = "zach@arguelles.me"},
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/zarguell/kevrichment"
Issues = "https://github.com/zarguell/kevrichment/issues"
