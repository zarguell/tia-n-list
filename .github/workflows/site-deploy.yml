name: Build & Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install generator deps
        # sigma stack pinned (2026-09-21): two independent regressions break
        # engine/test_sigma.py and the ssg.py publish gate with
        #   TypeError: 'str' object is not callable (conditions.postprocess)
        # 1) unpinned pysigma >=1.6, 2) pyparsing 3.3.3 (unpinned transitive
        #    dep) breaks pysigma 1.5.0 condition parsing — pin 3.3.2.
        # markdown pinned (2026-10-07): unpinned latest normalizes unquoted
        # HTML attrs (src=x -> src="x") while the local venv's 3.10.3
        # preserves them, so the remote link lint failed on markup the VPS
        # gate could not see. Pinned to the local version so both gates
        # render identically.
        run: pip install jinja2 "markdown==3.10.3" bleach "sigma-cli==3.1.0" "pysigma==1.5.0" "pyparsing==3.3.2" "pysigma-backend-splunk==2.1.0" "pysigma-backend-kusto==1.0.1" yara-x pytest requests
      # Derived Sigma variants are build-derived and untracked — without a
      # cache every build re-derives all 137 rules (272 CLI spawns, ~3/4 of
      # build time). Keyed by rule content: a rule change misses once and
      # re-derives only through the build's hash check (perf phase 1).
      - name: Restore derived Sigma variants
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            engine/data/cti/*.splunk
            engine/data/cti/*.kql
          key: sigma-variants-${{ hashFiles('engine/data/cti/*.sigma') }}
      - name: Save derived Sigma variants
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            engine/data/cti/*.splunk
            engine/data/cti/*.kql
          key: sigma-variants-${{ hashFiles('engine/data/cti/*.sigma') }}
      - name: Sanitizer regression suite
        run: python engine/test_sanitize.py
      - name: KEV candidates determinism suite
        run: python engine/test_cve_timeline.py
      - name: Ingest normalization suite
        run: python engine/test_ingest.py
      - name: Hot-score contract suite
        run: python engine/test_score.py
      - name: Reddit promotion regression
        run: python engine/test_reddit_promote.py
      - name: Social-signal loader contract
        run: python engine/test_social_posts.py
      - name: Merge clustering contract suite
        run: python engine/test_merge.py
      - name: Digest freshness contract suite
        run: python engine/test_digest_candidates.py
      - name: Story-card snippet contract suite
        run: python engine/test_ssg.py
      - name: Prose lint contract suite
        run: python engine/test_prose_lint.py
      - name: Sigma gate-parity suite
        run: python engine/test_sigma.py
      - name: Judgment-layer audit suite
        run: python engine/test_audit.py
      - name: Triage normalization suite
        run: python engine/test_triage.py
      - name: repair_dedupe orphan-heal suite
        run: python engine/test_repair_dedupe.py
      - name: Ghost-story cleanup suite
        run: python engine/test_cleanup_ghosts.py
      - name: kev schema/pipeline tests
        run: python -m pytest kevrichment/tests/test_schema.py kevrichment/tests/test_main.py kevrichment/tests/test_kev_site.py -q
      - name: Build the static site
        run: python engine/ssg.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install jsdom (scratch dir, outside the Pages artifact)
        run: npm install --prefix "$RUNNER_TEMP/jsdom" jsdom@26
      - name: Verify all-stories client render (jsdom)
        run: NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node engine/tests/verify-stories-all.js
      - name: Verify kev dashboard client render (jsdom)
        run: NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node engine/tests/verify-kev.js
      - name: Verify kev-candidates dashboard client render (jsdom)
        run: NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node engine/tests/verify-candidates.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
