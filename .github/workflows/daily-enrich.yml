name: daily-enrich

on:
  schedule:
    - cron: '0 6 * * 1-5'   # weekdays at 06:00 UTC (matches CISA update cadence)
  workflow_dispatch:          # manual trigger

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push updated data/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run kevrichment pipeline
        run: python main.py --cve-count 5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Commit and push updated data
        run: |
          git config user.name "kevrichment-bot"
          git config user.email "bot@arguelles.me"
          git add data/ latest.json
          if ! git diff --quiet --cached; then
            git commit -m "daily enrich $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes; skipping commit."
          fi
