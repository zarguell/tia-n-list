{% extends "base.html" %}
{% block title %}All stories — Tia N. List{% endblock %}
{% block content %}
<p class="eyebrow">{{ total }} stories</p>
<h1 class="page-title">All stories</h1>
<p class="lead">Every story we track, hot or not. The heat badge shows where each one sits.</p>

<div class="filters" role="search" aria-label="Filter stories">
  <label>Year
    <select id="f-year">
      <option value="">All years</option>
      {% for y in years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
    </select>
  </label>
  <label>Month
    <select id="f-month">
      <option value="">All months</option>
      {% for m in months %}<option value="{{ m[0] }}">{{ m[1] }}</option>{% endfor %}
    </select>
  </label>
  <label>Sort
    <select id="f-sort">
      <option value="latest" selected>Latest first</option>
      <option value="hot">Hot first</option>
    </select>
  </label>
  <label class="f-search">Search
    <input id="f-q" type="search" placeholder="Title, story, source" autocomplete="off">
  </label>
  <span class="f-count" id="f-count"></span>
</div>

<div class="story-grid" id="story-grid">
  <p class="no-results" id="loading">Loading stories…</p>
</div>

<p class="no-results" id="no-results" hidden>No stories match.</p>

<nav class="pager" id="pager" aria-label="Pagination"></nav>

<script>
(function () {
  var grid = document.getElementById('story-grid');
  var fYear = document.getElementById('f-year');
  var fMonth = document.getElementById('f-month');
  var fQ = document.getElementById('f-q');
  var fSort = document.getElementById('f-sort');
  var count = document.getElementById('f-count');
  var noResults = document.getElementById('no-results');
  var loading = document.getElementById('loading');
  var pager = document.getElementById('pager');
  var PAGE_SIZE = 12;
  var page = 1;
  var all = [];        // compact story index (fetched), with search text precomputed

  // initial filters from the URL (shared/bookmarked links)
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.get('year')) fYear.value = p.get('year');
    if (p.get('month')) fMonth.value = p.get('month');
    if (p.get('sort') === 'hot') fSort.value = 'hot';
    if (p.get('q')) fQ.value = p.get('q');
    if (p.get('page')) page = parseInt(p.get('page'), 10) || 1;
  })();

  // Builds one story card from the compact index. All data lands via
  // textContent (never innerHTML interpolation) so titles/snippets/sources
  // from articles cannot inject markup.
  function cardEl(s, rank) {
    var art = document.createElement('article');
    art.className = 'story-card';
    art.dataset.year = s.first_seen.slice(0, 4);
    art.dataset.month = String(parseInt(s.first_seen.slice(5, 7), 10));
    art.dataset.score = s.score;
    art.dataset.lastseen = s.last_seen;
    art.dataset.search = (s.title + ' ' + s.snippet + ' ' + s.sources.join(' ')).toLowerCase();

    var top = document.createElement('div');
    top.className = 'topline';
    var r = document.createElement('span');
    r.className = 'rank';
    r.textContent = rank;
    top.appendChild(r);
    if (s.heat_label) {
      var h = document.createElement('span');
      h.className = 'heat ' + s.heat_class;
      h.textContent = s.heat_label;
      top.appendChild(h);
    }
    art.appendChild(top);

    var h3 = document.createElement('h3');
    var a = document.createElement('a');
    a.href = s.url;
    a.textContent = s.title;
    h3.appendChild(a);
    art.appendChild(h3);

    var sn = document.createElement('p');
    sn.className = 'snippet';
    sn.textContent = s.snippet;
    art.appendChild(sn);

    var meta = document.createElement('div');
    meta.className = 'meta';
    s.sources.forEach(function (src) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = src;
      meta.appendChild(c);
    });
    s.cves.forEach(function (cve) {
      var linked = s.kev_cves && s.kev_cves.indexOf(cve) !== -1;
      var c = document.createElement(linked ? 'a' : 'span');
      c.className = linked ? 'chip cve linked' : 'chip cve';
      c.textContent = cve;
      if (linked) c.href = 'kev/cves/' + cve + '/';
      meta.appendChild(c);
    });
    if (s.kev_cves && s.kev_cves.length) {
      var kb = document.createElement('span');
      kb.className = 'chip kev';
      kb.textContent = 'KEV';
      kb.title = 'In CISA KEV - enrichment on site';
      meta.appendChild(kb);
    }
    if (s.reddit) {
      var c = document.createElement('span');
      c.className = 'chip reddit';
      c.textContent = '▲ ' + s.reddit;
      meta.appendChild(c);
    }
    var rt = document.createElement('span');
    rt.className = 'reltime';
    rt.textContent = s.last_seen_human;
    meta.appendChild(rt);
    art.appendChild(meta);
    return art;
  }

  function matches(s) {
    return (!fYear.value || s.first_seen.slice(0, 4) === fYear.value) &&
           (!fMonth.value || String(parseInt(s.first_seen.slice(5, 7), 10)) === fMonth.value) &&
           (!fQ.value || s._search.indexOf(fQ.value.toLowerCase().trim()) !== -1);
  }

  function setUrl() {
    var params = new URLSearchParams();
    if (fYear.value) params.set('year', fYear.value);
    if (fMonth.value) params.set('month', fMonth.value);
    if (fQ.value) params.set('q', fQ.value.trim());
    if (fSort.value === 'hot') params.set('sort', 'hot');
    if (page > 1) params.set('page', page);
    // location.pathname is origin-absolute: immune to the <base> tag
    var qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  function pageHref(p) {
    var params = new URLSearchParams();
    if (fYear.value) params.set('year', fYear.value);
    if (fMonth.value) params.set('month', fMonth.value);
    if (fQ.value) params.set('q', fQ.value.trim());
    if (fSort.value === 'hot') params.set('sort', 'hot');
    if (p > 1) params.set('page', p);
    var qs = params.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }

  function renderPager(pages) {
    if (pages <= 1) { pager.innerHTML = ''; return; }
    function link(label, p, cls) {
      if (cls.indexOf('disabled') !== -1) {
        return '<span class="page ' + cls + '">' + label + '</span>';
      }
      return '<a class="page ' + cls + '" href="' + pageHref(p) + '" data-page="' + p + '">' + label + '</a>';
    }
    var html = link('Prev', page - 1, page <= 1 ? 'disabled' : '');
    var start = Math.max(1, page - 2);
    var end = Math.min(pages, page + 2);
    if (start > 1) {
      html += link(1, 1, page === 1 ? 'current' : '');
      if (start > 2) html += '<span class="page gap">…</span>';
    }
    for (var p = start; p <= end; p++) {
      html += link(p, p, p === page ? 'current' : '');
    }
    if (end < pages) {
      if (end < pages - 1) html += '<span class="page gap">…</span>';
      html += link(pages, pages, page === pages ? 'current' : '');
    }
    html += link('Next', page + 1, page >= pages ? 'disabled' : '');
    pager.innerHTML = html;
  }

  function apply() {
    var sorted = all.slice();
    if (fSort.value === 'latest') {
      sorted.sort(function (a, b) { return b.last_seen.localeCompare(a.last_seen); });
    } else {
      sorted.sort(function (a, b) { return b.score - a.score; });
    }
    var visible = sorted.filter(matches);
    var pages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    if (page > pages) page = pages;
    var startIdx = (page - 1) * PAGE_SIZE;
    var slice = visible.slice(startIdx, startIdx + PAGE_SIZE);
    grid.innerHTML = '';
    slice.forEach(function (s, i) {
      grid.appendChild(cardEl(s, startIdx + i + 1));
    });
    count.textContent = visible.length + ' of ' + all.length;
    noResults.hidden = visible.length !== 0;
    renderPager(pages);
    setUrl();
  }

  fetch('stories-index.json').then(function (r) { return r.json(); }).then(function (data) {
    data.forEach(function (s) {
      s._search = (s.title + ' ' + s.snippet + ' ' + s.sources.join(' ')).toLowerCase();
    });
    all = data;
    loading.hidden = true;
    apply();
  }).catch(function () {
    loading.textContent = 'Could not load the story index.';
  });

  [fYear, fMonth, fQ, fSort].forEach(function (el) {
    el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', function () {
      page = 1;
      apply();
    });
  });
  pager.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[data-page]');
    if (!a) return;
    ev.preventDefault();
    page = parseInt(a.getAttribute('data-page'), 10);
    apply();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
{% endblock %}
