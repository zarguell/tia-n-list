<article class="story-card" data-year="{{ s.first_seen[:4] }}" data-month="{{ s.first_seen[5:7]|int }}" data-score="{{ s.score }}" data-lastseen="{{ s.last_seen }}">
  <div class="topline">
    <span class="rank">{{ rank }}</span>
    <span class="heat {{ s.heat_class }}">{{ s.heat_label }}</span>
  </div>
  <h3><a href="{{ s.url }}">{{ s.title }}</a></h3>
  <p class="snippet">{{ s.snippet }}</p>
  <div class="meta">
    {% for src in s.sources %}<span class="chip">{{ src }}</span>{% endfor %}
    {% for c in s.cves %}<span class="chip cve">{{ c }}</span>{% endfor %}
    {% if s.reddit %}<span class="chip reddit">▲ {{ s.reddit }}</span>{% endif %}
    <span class="reltime">{{ s.last_seen_human }}</span>
  </div>
</article>
