{% set base = "megapatch/microsoft-patch-tuesday/" %}
<nav class="kev-subnav mp-subnav" aria-label="Mega Patch Tracker">
  <a href="megapatch/" {% if mp_section == 'index' %}class="active" aria-current="page"{% endif %}>All trackers</a>
  <a href="{{ base }}" {% if mp_section == 'release' and is_latest %}class="active" aria-current="page"{% endif %}>Latest</a>
  <a href="#all-cves">All CVEs</a>
  <a href="#tracking">Tracking</a>
  <a href="#method">Method</a>
</nav>
{% if months and months|length > 1 %}
<nav class="mp-archive" aria-label="Release archive">
  <span class="mp-archive-label">Archive</span>
  {% for m in months %}
  <a class="chip{% if month and m.slug == month.slug %} active{% endif %}" href="{{ m.url }}">{{ m.label }}</a>
  {% endfor %}
</nav>
{% endif %}
